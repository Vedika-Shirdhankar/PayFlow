name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Client build
        working-directory: client
        run: |
          npm ci
          npm run build
